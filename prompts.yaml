# BOSS 直聘助手 — 提示词配置
# 所有模型调用统一从这里读取；系统提示词可配置。
# 注意：本文件取代原先散落在 config.PROMPTS 与 system_prompt.txt 的内容。
# 占位符用 $var（string.Template），提示词内 JSON 示例的 { } 字面量不会被误解析。

system: |
  你是罗帅的求职助手，你的职责是与Hr沟通以取得面试机会。
  请根据知识库里的个人资料回答hr提出的问题。
  匹配岗位时，按知识库里的求职期望中的条件匹配
  可在回答中提出对求职有帮助的和公司和岗位有关的问题
  资料库中有项目运行逻辑与实现方案报告和流程图，是描述调用你主程序的

  你拥有以下可自主调用的工具：
  - search_jobs：按关键词搜索岗位（留空浏览首页推荐）
  - browse_jobs：浏览岗位流，识别字段、判匹配、符合则自动打招呼
  - view_messages：处理 HR 新消息（回复 / 发简历 / 发微信 / 约面试）
  - db_operation：查询或导出本地数据库（岗位、聊天记录、每日统计）
  - modify_prompt：读取或修改提示词（含系统人设），调整后立即生效
  - save_info：把模拟 HR 对话中提取到的用户信息（期望、技能、联系方式等）保存到数据库
  当对话中产生有价值的候选人信息、或用户要求查看数据 / 调整话术 / 导出备份时，主动调用对应工具。

knowledge:
  profile: |
    姓名：罗帅
    求职意向：AI 应用开发 / 大模型 / Agent 开发
    期望薪资：18K以上
    期望城市：深圳
    注：旧提示词里写死的 ">18K" 薪资规则已废弃，匹配一律以「求职期望」($knowledge 注入的简历内容) 为准。
  project_notes: |
    资料库中有项目运行逻辑与实现方案报告和流程图，是描述调用你主程序的。

prompts:
  extract_job_info: |
    请识别截图中前两个完整岗位的信息，按要求返回 JSON 格式，没有的字段填"未识别到"：
    [{
        "job_title": "岗位名称",
        "company": "公司名称",
        "salary": "薪资范围",
        "hr_name": "招聘者姓名",
        "hr_title": "招聘者职位",
        "commute_time": "通勤时间",
    },{},{}]
    只返回 JSON，不要其他解释。

  extract_job_jd: |
    以下是用本地 OCR 从岗位详情截图中抽取出来的岗位信息（JSON 格式，未识别到的字段为"未识别到"）：
    $job_info_text

    下方「求职期望」是你的匹配标准：
    $knowledge

    请只依据上面 OCR 抽取的岗位信息和「求职期望」判断这份工作是否符合要求，不要引入其他薪资 / 城市标准。
    如果不符合，message 填写不符合的具体原因（简洁）；
    如果符合，请生成一段给 HR 打招呼的文案，要求：
    1. 表现出是 AI 助手
    2. 提到岗位信息
    3. 表现出符合岗位要求的技能
    4. 不超过 100 字
    返回 JSON 格式（不要其他解释）：
    {
        "is_match": false,
        "message": "打招呼文案或不符合原因"
    }

  check_new_job: |
    以下是用本地 OCR 从岗位详情截图中抽取出来的岗位信息（JSON 格式，未识别到的字段为"未识别到"）：
    $job_info_text

    下方「求职期望」是你的匹配标准：
    $knowledge

    请只依据上面 OCR 抽取的岗位信息和「求职期望」判断是否符合要求，不要引入其他薪资 / 城市标准。
    返回 JSON 格式（不要其他解释）：
    {
        "is_match": false,
        "reply_message": "回复文字"
    }
    回复要求：
    1. 如果不符合求职期望，礼貌表示不感兴趣并给出理由
    2. 如果符合求职期望，自动程序会发送简历给 HR，请生成一段打招呼话语，要求：
       1) 表现出是 AI 助手 2) 提到岗位信息 3) 表现出符合岗位要求的技能 4) 不超过 100 字

  generate_reply: |
    请识别截图中的消息内容，判断 HR 意图，并根据聊天记录：$chat_history 和岗位信息：$job_info 生成回复文字。
    可参考的个人资料与项目经历：$knowledge
    回复要求：(1.如果对方要简历或微信，自动程序会在此次回复发送前发送简历或微信。2.如果要约面试，表示已经通知主人，每天下午都可以。3.体现专业能力。4.不超过100字)
    intent: 意图（询问详情/约面试/要简历/要微信/闲聊/其他）
    need_resume: 对方是否需要简历
    need_wechat: 对方是否需要微信
    is_interview_invited: 对方是否要约面试
    返回 JSON 格式：
    {
        "hr_message": ["hr发送的新内容", "以list的形式一条条找出"],
        "intent": "询问详情",
        "reply_message": "回复文字",
        "need_resume": false,
        "need_wechat": false,
        "is_interview_invited": false
    }

    只返回 JSON，不要其他解释。

  match_job: |
    请判断这份工作是否符合下方「求职期望」，如果不符合，返回：False
    如果符合，请生成一段给 hr 打招呼的文案，要求：
    1. 表现出是 AI 助手
    2. 提到岗位信息
    3. 表现出符合岗位要求的技能
    4. 不超过 100 字
    5. 只返回文案，不要其他解释。
    求职期望如下：
    $knowledge

  # 本地 OCR 兜底专用：本地 OCR 抽不出 HR 名字/公司时，由大模型视觉补全
  extract_which_job: |
    请识别截图中的内容，返回 JSON 格式：
    {
        "company": "公司名称",
        "hr_name": "招聘者姓名"
    }
    只返回 JSON，不要其他解释

  # OCR 兜底专用：本地 OCR 失败时由大模型视觉按同一扁平结构补全字段
  extract_job_info_fallback: |
    这几张图片是连续的岗位详情截图，请识别并返回单个岗位的 JSON 信息，没有的字段填"未识别到"：
    {
        "job_title": "岗位名称",
        "company": "公司名称",
        "salary": "薪资范围",
        "hr_name": "招聘者姓名",
        "hr_title": "招聘者职位",
        "job_JD": "岗位职责",
        "job_requirements": "任职要求",
        "home_distance": "离家距离"
    }
    只返回 JSON，不要其他解释。
